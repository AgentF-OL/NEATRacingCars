# Configuration inspired by https://neat-python.readthedocs.io/en/latest/config_essentials.html

[NEAT]
# How many genomes per generation
pop_size               = 300
# Stop when this fitness is reached
fitness_threshold      = 100000
# Use the maximum fitness
fitness_criterion      = max
# Do not create a new population if all the species of this generation become extint
reset_on_extinction    = False
# Terminate once the fitness criterion is reached
no_fitness_termination = False

[DefaultGenome]
# Network Structure

# Number of input neurons -> radar distances
num_inputs         = 5
# Number of output neurons -> acceleration in terms of angle and magnitude
num_outputs        = 3
# Number of hidden neurons -> start with no hidden nodes, simple network
num_hidden         = 0
# Use no recurrent connections in the generated phenotype networks
feed_forward       = True
# Start will all input nodes connected to all output nodes
initial_connection = full_direct

# Activation Functions

# Activation function for node genes
activation_default     = tanh
# Change the activation function with this probability
activation_mutate_rate = 0.0
# Choose one of these functions on mutation
activation_options     = tanh sigmoid relu

# Aggregation Functions

# Aggregation function for node genes when they receive aggregate input signals from other nodes before activation
aggregation_default     = sum
# Do not change the aggregation function
aggregation_mutate_rate = 0.0
# Always use the sum function
aggregation_options     = sum

# Node Bias Options

# Average starting bias
bias_init_mean    = 50.0
# Variation in starting bias
bias_init_stdev   = 1.0
# Random distribution to use
bias_init_type    = gaussian
# Maximum allowed bias
bias_max_value    = 100.0
# Minimum allowed bias
bias_min_value    = 5.0
# How much to change when mutating
bias_mutate_power = 0.5
# Probability of mutating bias
bias_mutate_rate  = 0.7
# Probability of completely replacing bias
bias_replace_rate = 0.1

# Genome Compatibility Options -> for grouping genomes into species

# Weight for non-matching genes of parents during crossover
compatibility_disjoint_coefficient = 1.0
# Weight for weight differences (bias, response attributes of node genes and weight attributes of connection genes)
compatibility_weight_coefficient   = 0.5

# Structural Mutation Probabilities (per genome, per generation)

# Add a new connection
conn_add_prob    = 0.4
# Remove a connection
conn_delete_prob = 0.4
# Add a new hidden neuron
node_add_prob    = 0.15
# Remove a hidden neuron
node_delete_prob = 0.15

# Connection Enable/Disable Options

# New connections start enabled
enabled_default           = True
# Probability of toggling enabled state
enabled_mutate_rate       = 0.01
# Extra probability to enable
enabled_rate_to_true_add  = 0.0
# Extra probability to disable
enabled_rate_to_false_add = 0.0

# Connection Weight Options

# Average starting weight
weight_init_mean    = 0.0
# Variation in starting weight
weight_init_stdev   = 1.0
# Random distribution
weight_init_type    = gaussian
# Maximum weight magnitude
weight_max_value    = 30
# Minimum weight magnitude
weight_min_value    = -30
# How much to change when mutating
weight_mutate_power = 0.5
# Probability of mutating weight
weight_mutate_rate  = 0.8
# Probability of completely replacing weight
weight_replace_rate = 0.1

# Node Response Options

# Average starting response multiplier
response_init_mean    = 0.0
# Variation in starting response multiplier
response_init_stdev   = 1.0
# Random distribution to use
response_init_type    = gaussian
# Maximum allowed response multiplier
response_max_value    = 4.0
# Minimum allowed response multiplier
response_min_value    = -1.0
# How much to change when mutating
response_mutate_power = 0.5
# Probability of mutating
response_mutate_rate  = 0.7
# Probability of completely replacing
response_replace_rate = 0.1

# Structural Mutation Control

# Allow multiple structural changes per genome
single_structural_mutation = False
# Fallback behavior
structural_mutation_surer  = default

[DefaultSpeciesSet]
# How similar genomes must be to group together
compatibility_threshold = 3.0

[DefaultStagnation]
# How to rank species for stagnation removal -> use best genome in species
species_fitness_func = max
# Remove species that don't improve for this many generations
max_stagnation       = 20
# Protect the best N species from stagnation removal
species_elitism      = 5

[DefaultReproduction]
# Always keep the best N genomes unchanged
elitism            = 5
# Only the top X% of each species can reproduce -> 0.5 = top 50%
survival_threshold = 0.5
# Minimum members for a species to be maintained
min_species_size   = 5